name: CI

# Every build keeps the bundle as a workflow artifact. A release tag (bare
# version, created by `./gradlew release`) also attaches it to a GitHub
# Release, which is where the Strange Eons registry finds it.
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check sePlugin
      - uses: actions/upload-artifact@v7
        with:
          name: GraalJSLanguage
          path: build/libs/GraalJSLanguage.selibrary
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches version
        run: |
          if ! grep -qx "version=${GITHUB_REF_NAME}" gradle.properties; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in gradle.properties"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: GraalJSLanguage
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/GraalJSLanguage.selibrary --verify-tag --generate-notes
